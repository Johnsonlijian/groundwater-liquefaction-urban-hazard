<rect x="1625" y="1138" width="310" height="40" rx="20" fill="#2E7D3A" stroke="#2E7D3A" stroke-width="1.5" opacity="1"/><text x="1780.0" y="1165.0" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="white" opacity="1.0" style="">multi-hazard audit</text>
